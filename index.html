<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARCEIRO GRINGO - Prática de Conversação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                        'dark-bg': '#181818'
                    }
                }
            }
        }
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .loading-dots:after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body class="bg-white dark:bg-dark-bg text-gray-900 dark:text-white min-h-screen transition-colors">
    <div class="container mx-auto px-4 py-6 max-w-4xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold mb-2 text-primary">🇬🇧 PARCEIRO GRINGO</h1>
            <p class="text-gray-600 dark:text-gray-300">Pratique conversação em inglês com diálogos interativos</p>
        </div>

        <!-- Step 1: Upload/Paste Dialog -->
        <div id="step1" class="mb-8">
            <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <span class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center text-sm mr-3">1</span>
                    Adicionar Diálogo
                </h2>
                
                <div class="space-y-4">
                    <!-- File Upload -->
                    <div class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-6 text-center">
                        <input type="file" id="fileInput" accept=".txt" class="hidden">
                        <button onclick="document.getElementById('fileInput').click()" 
                                class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg transition-colors">
                            📁 Upload Arquivo
                        </button>
                        <p class="text-gray-500 dark:text-gray-400 mt-2">ou</p>
                    </div>

                    <!-- Text Area -->
                    <div>
                        <label class="block text-sm font-medium mb-2">Cole seu diálogo aqui:</label>
                        <textarea id="dialogInput" 
                            placeholder="Exemplo:&#10;Emma: Hello! Are you new here?&#10;Carlos: Yes, I am. It’s my first day today."
                            class="w-full h-32 text-base px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary resize-none"></textarea>
                    </div>

                    <button onclick="parseDialog()" 
                            class="w-full bg-primary hover:bg-primary/90 text-white py-3 rounded-lg font-medium transition-colors">
                        Analisar Diálogo
                    </button>
                </div>
            </div>
        </div>

        <!-- Step 2: Configuração -->
        <div id="step2" class="mb-8 hidden">
            <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6 mb-6">
                <h2 class="text-xl font-semibold mb-4 flex items-center">
                    <span class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center text-sm mr-3">2</span>
                    Configuração da Conversa
                </h2>

                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Mode Selection -->
                    <div>
                        <label class="block text-sm font-medium mb-3">Modo de Prática:</label>
                        <div class="space-y-3">
                            <label class="flex items-center p-3 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
                                <input type="radio" name="mode" value="conversation" checked class="mr-3">
                                <div>
                                    <div class="font-medium">💬 Conversação</div>
                                    <div class="text-sm text-gray-500 dark:text-gray-400">Você escolhe um personagem e conversa com o app</div>
                                </div>
                            </label>
                            <label class="flex items-center p-3 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
                                <input type="radio" name="mode" value="listen" class="mr-3">
                                <div>
                                    <div class="font-medium">🎧 Escutar</div>
                                    <div class="text-sm text-gray-500 dark:text-gray-400">O app fala todos os personagens para você escutar</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Character Selection -->
                    <div id="characterSelection">
                        <label class="block text-sm font-medium mb-3">Escolha seu personagem:</label>
                        <div id="characterList" class="space-y-2">
                            <!-- preenchido via JS -->
                        </div>
                    </div>
                </div>

                <!-- Tradução -->
                <div class="mt-6">
                    <div class="flex items-center justify-between mb-3">
                        <label class="block text-sm font-medium">Tradução:</label>
                        <div class="space-x-2">
                            <button id="translateBtn" onclick="translateDialog()" 
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm transition-colors">
                                🌍 Traduzir para Português
                            </button>
                            <button id="toggleTranslationBtn" onclick="toggleTranslation()" 
                                    class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm transition-colors hidden">
                                🔄 Ocultar Tradução
                            </button>
                        </div>
                    </div>

                    <!-- Status da Tradução -->
                    <div id="translationStatus" class="hidden mt-2">
                        <div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-700 rounded-lg p-3">
                            <div id="translationStatusText" class="text-sm text-blue-700 dark:text-blue-300"></div>
                        </div>
                    </div>

                    <!-- Tradução aparece logo abaixo do botão -->
                    <div id="translatedDialog" class="hidden mt-2">
                        <div class="bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-700 rounded-lg p-3">
                            <h3 class="font-medium text-yellow-800 dark:text-yellow-200 mb-2">Diálogo Traduzido:</h3>
                            <div id="translatedText" class="text-sm text-yellow-700 dark:text-yellow-300 space-y-1 max-h-40 overflow-y-auto"></div>
                        </div>
                    </div>
                </div>

                <!-- Voz -->
                <div class="mt-6">
                    <label class="block text-sm font-medium mb-3">Voz do App (sotaque britânico):</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center p-3 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
                            <input type="radio" name="voice" value="Google UK English Male" checked class="mr-3">
                            <span>🧑 Masculina (George)</span>
                        </label>
                        <label class="flex items-center p-3 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700">
                            <input type="radio" name="voice" value="Google UK English Female" class="mr-3">
                            <span>👩 Feminina (Lily)</span>
                        </label>
                    </div>
                </div>

                <button onclick="startPractice()" 
                        class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-medium transition-colors">
                    Começar Prática
                </button>
            </div>
        </div>

        <!-- Step 3: Prática -->
        <div id="step3" class="mb-8 hidden">
            <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold flex items-center">
                        <span class="bg-primary text-white rounded-full w-8 h-8 flex items-center justify-center text-sm mr-3">3</span>
                        <span id="practiceTitle">Prática de Conversação</span>
                    </h2>
                    <button onclick="resetApp()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                        🔄 Reiniciar
                    </button>
                </div>

                <!-- Área de conversa -->
                <div id="conversationArea" class="mb-6">
                    <div id="dialogHistory" class="space-y-4 mb-6 max-h-96 overflow-y-auto"></div>

                    <!-- Vez do usuário -->
                    <div id="currentTurn" class="hidden">
                        <div class="bg-blue-50 dark:bg-blue-900/30 border-l-4 border-blue-500 p-4 mb-4">
                            <div class="font-medium text-blue-800 dark:text-blue-300">Sua vez de falar:</div>
                            <div id="currentLine" class="text-blue-700 dark:text-blue-200 mt-1"></div>
                        </div>
                        
                        <div class="space-y-3">
                            <div class="flex items-center space-x-3">
                                <button id="listenBtn" onclick="startListening()" 
                                        class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-lg transition-colors">
                                    🎤 Começar a Falar
                                </button>
                                <button onclick="speakUserLine()" 
                                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-colors">
                                    🔊 Ouvir Exemplo
                                </button>
                                <button onclick="skipTurn()" 
                                        class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors">
                                    ⏭️ Pular
                                </button>
                            </div>

                            <div id="speechFeedback" class="hidden">
                                <div id="recognizedText" class="bg-gray-100 dark:bg-gray-700 p-3 rounded border text-sm"></div>
                                <div class="flex items-center space-x-2 mt-2">
                                    <button onclick="confirmSpeech()" 
                                            class="bg-green-600 hover:bg-green-700 text-white px-4 py-1 rounded text-sm">
                                        ✓ Continuar
                                    </button>
                                    <button onclick="retrySpeech()" 
                                            class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-1 rounded text-sm">
                                        🔄 Tentar Novamente
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modo escutar -->
                    <div id="listenControls" class="hidden">
                        <div class="flex justify-center space-x-4">
                            <button onclick="playFullDialog()" 
                                    class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg transition-colors">
                                ▶️ Reproduzir Diálogo Completo
                            </button>
                            <button onclick="playCurrentLine()" 
                                    class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg transition-colors">
                                🔊 Repetir Frase Atual
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Progresso -->
                <div class="bg-gray-200 dark:bg-gray-700 rounded-full h-2 mb-4">
                    <div id="progressBar" class="bg-primary h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="text-sm text-gray-600 dark:text-gray-400 text-center">
                    <span id="progressText">0 de 0 falas</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer com Copyright -->
    <footer class="mt-6 pb-4 text-center text-xs text-gray-500 dark:text-gray-400">
        © <span id="year"></span> Copyright crenatojls
    </footer>

    <script>
        // Ano no rodapé
        document.getElementById('year').textContent = new Date().getFullYear();

        // Estado global
        let dialogData = [];
        let translatedData = [];
        let characters = [];
        let currentLineIndex = 0;
        let userCharacter = '';
        let appVoice = 'Google UK English Male';
        let practiceMode = 'conversation';
        let recognition;
        let isListening = false;
        let showTranslation = true;

        function showAlert(msg) {
            alert(msg);
        }

        // Upload arquivo .txt
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('dialogInput').value = e.target.result;
                };
                reader.readAsText(file);
            }
        });

        // Parse do diálogo
        function parseDialog() {
            const text = document.getElementById('dialogInput').value.trim();
            if (!text) {
                showAlert('Por favor, adicione um diálogo primeiro.');
                return;
            }

            const lines = text.split('\n').filter(line => line.trim());
            dialogData = [];
            translatedData = [];
            characters = new Set();

            for (let line of lines) {
                const match = line.match(/^([^:]+):\s*(.+)$/);
                if (match) {
                    const character = match[1].trim();
                    const dialog = match[2].trim();
                    characters.add(character);
                    dialogData.push({ character, dialog });
                }
            }

            if (!dialogData.length) {
                showAlert('Use o formato "Personagem: fala" em cada linha.');
                return;
            }

            characters = Array.from(characters);
            setupCharacterSelection();
            showStep(2);

            document.getElementById('translatedDialog').classList.add('hidden');
            document.getElementById('toggleTranslationBtn').classList.add('hidden');
            document.getElementById('translationStatus').classList.add('hidden');
        }

        function setupCharacterSelection() {
            const list = document.getElementById('characterList');
            list.innerHTML = '';

            characters.forEach((c, i) => {
                const label = document.createElement('label');
                label.className = 'flex items-center p-3 border border-gray-300 dark:border-gray-600 rounded-lg cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700';
                label.innerHTML = `
                    <input type="radio" name="character" value="${c}" ${i === 0 ? 'checked' : ''} class="mr-3">
                    <span class="font-medium">${c}</span>
                `;
                list.appendChild(label);
            });
        }

        // Troca modo e voz
        document.addEventListener('change', e => {
            if (e.target.name === 'mode') {
                practiceMode = e.target.value;
                document.getElementById('characterSelection').style.display =
                    practiceMode === 'conversation' ? 'block' : 'none';
            }
            if (e.target.name === 'voice') {
                appVoice = e.target.value;
            }
        });

        // --------- TRADUÇÃO CORRIGIDA ----------

        async function translateDialog() {
            if (!dialogData.length) {
                showAlert('Adicione e analise um diálogo antes de traduzir.');
                return;
            }

            const btn = document.getElementById('translateBtn');
            const statusDiv = document.getElementById('translationStatus');
            const statusText = document.getElementById('translationStatusText');
            
            btn.textContent = 'Traduzindo...';
            btn.disabled = true;
            statusDiv.classList.remove('hidden');
            statusText.textContent = 'Iniciando tradução...';
            statusText.className = 'text-sm text-blue-700 dark:text-blue-300 loading-dots';

            try {
                let successCount = 0;
                let failCount = 0;
                
                translatedData = [];
                
                for (let i = 0; i < dialogData.length; i++) {
                    const line = dialogData[i];
                    
                    statusText.textContent = `Traduzindo ${i + 1} de ${dialogData.length} linhas...`;
                    
                    try {
                        const translatedText = await translateWithFallback(line.dialog);
                        if (translatedText && translatedText !== line.dialog) {
                            successCount++;
                            translatedData.push({ character: line.character, dialog: translatedText });
                        } else {
                            failCount++;
                            translatedData.push({ character: line.character, dialog: line.dialog + " [Não traduzido]" });
                        }
                    } catch (error) {
                        failCount++;
                        translatedData.push({ character: line.character, dialog: line.dialog + " [Erro na tradução]" });
                    }
                    
                    // Pequena pausa entre requests para evitar rate limiting
                    if (i < dialogData.length - 1) {
                        await new Promise(resolve => setTimeout(resolve, 300));
                    }
                }

                // Exibir resultado
                displayTranslatedDialog();
                document.getElementById('translatedDialog').classList.remove('hidden');
                const toggleBtn = document.getElementById('toggleTranslationBtn');
                toggleBtn.classList.remove('hidden');
                toggleBtn.textContent = '🔄 Ocultar Tradução';
                showTranslation = true;

                // Status final
                statusText.className = 'text-sm text-green-700 dark:text-green-300';
                if (failCount === 0) {
                    statusText.textContent = `✅ Tradução concluída! Todas as ${successCount} linhas foram traduzidas com sucesso.`;
                } else {
                    statusText.textContent = `⚠️ Tradução parcial: ${successCount} linhas traduzidas, ${failCount} falhas.`;
                }

            } catch (error) {
                console.error('Erro na tradução:', error);
                statusText.className = 'text-sm text-red-700 dark:text-red-300';
                statusText.textContent = '❌ Erro na tradução. Verifique sua conexão e tente novamente.';
            } finally {
                btn.textContent = '🌍 Traduzir para Português';
                btn.disabled = false;
            }
        }

        async function translateWithFallback(text) {
            // Método 1: DeepL API (mais confiável para frases completas)
            try {
                const translated = await translateDeepL(text);
                if (translated && translated !== text) {
                    return translated;
                }
            } catch (error) {
                console.warn('DeepL falhou:', error);
            }

            // Método 2: Google Translate API
            try {
                const translated = await translateGoogleImproved(text);
                if (translated && translated !== text) {
                    return translated;
                }
            } catch (error) {
                console.warn('Google Translate falhou:', error);
            }

            // Método 3: MyMemory API (fallback)
            try {
                const translated = await translateMyMemory(text);
                if (translated && translated !== text) {
                    return translated;
                }
            } catch (error) {
                console.warn('MyMemory Translate falhou:', error);
            }

            return null;
        }

        async function translateDeepL(text) {
            try {
                // Usando a API gratuita do DeepL (limite de 500,000 chars/mês)
                const authKey = 'fd5c0a72-5f56-4de8-8e00-91281f812a2b:fx'; // Chave gratuita
                const url = 'https://api-free.deepl.com/v2/translate';
                
                const params = new URLSearchParams({
                    auth_key: authKey,
                    text: text,
                    target_lang: 'PT',
                    source_lang: 'EN'
                });

                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: params
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const data = await res.json();
                const translated = data.translations?.[0]?.text;
                
                if (translated && translated !== text) {
                    return translated;
                }
                return null;
            } catch (error) {
                console.warn('Erro DeepL Translate:', error);
                return null;
            }
        }

        async function translateGoogleImproved(text) {
            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const json = await res.json();
                
                // Processar todas as partes da tradução
                let fullTranslation = '';
                if (json && json[0]) {
                    for (const item of json[0]) {
                        if (item[0]) {
                            fullTranslation += item[0];
                        }
                    }
                }
                
                // Validar se a tradução é significativamente diferente do original
                if (fullTranslation && fullTranslation !== text && fullTranslation.length > 0) {
                    return fullTranslation;
                }
                return null;
            } catch (error) {
                console.warn('Erro Google Translate:', error);
                return null;
            }
        }

        async function translateMyMemory(text) {
            try {
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|pt`;
                const res = await fetch(url);
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                
                const json = await res.json();
                const translated = json.responseData?.translatedText;
                
                if (translated && translated !== text && !translated.includes('MYMEMORY WARNING')) {
                    return translated;
                }
                return null;
            } catch (error) {
                console.warn('Erro MyMemory Translate:', error);
                return null;
            }
        }

        function displayTranslatedDialog() {
            const container = document.getElementById('translatedText');
            container.innerHTML = '';
            translatedData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'border-b border-yellow-200 dark:border-yellow-700 pb-1 mb-1 last:border-b-0 last:mb-0';
                
                const isTranslated = !item.dialog.includes('[Não traduzido]') && !item.dialog.includes('[Erro na tradução]');
                const textClass = isTranslated ? 'text-yellow-700 dark:text-yellow-300' : 'text-red-600 dark:text-red-400 italic';
                
                div.innerHTML = `<strong>${item.character}:</strong> <span class="${textClass}">${item.dialog}</span>`;
                container.appendChild(div);
            });
        }

        function toggleTranslation() {
            showTranslation = !showTranslation;
            const container = document.getElementById('translatedDialog');
            const btn = document.getElementById('toggleTranslationBtn');

            if (showTranslation) {
                container.classList.remove('hidden');
                btn.textContent = '🔄 Ocultar Tradução';
            } else {
                container.classList.add('hidden');
                btn.textContent = '🔄 Mostrar Tradução';
            }
        }

        // --------- PRÁTICA (CONVERSAÇÃO / ESCUTAR) ----------

        function startPractice() {
            const mode = document.querySelector('input[name="mode"]:checked');
            practiceMode = mode ? mode.value : 'conversation';

            if (practiceMode === 'conversation') {
                const charRadio = document.querySelector('input[name="character"]:checked');
                if (!charRadio) {
                    showAlert('Escolha um personagem.');
                    return;
                }
                userCharacter = charRadio.value;
                initSpeechRecognition();
            }

            currentLineIndex = 0;
            document.getElementById('dialogHistory').innerHTML = '';
            updateProgress();
            document.getElementById('practiceTitle').textContent =
                practiceMode === 'conversation'
                    ? `Você é: ${userCharacter}`
                    : 'Escutar Diálogo Completo';

            showStep(3);

            if (practiceMode === 'listen') {
                document.getElementById('currentTurn').classList.add('hidden');
                document.getElementById('listenControls').classList.remove('hidden');
            } else {
                document.getElementById('listenControls').classList.add('hidden');
                document.getElementById('currentTurn').classList.remove('hidden');
                showNextTurn();
            }
        }

        // Avança o diálogo (modo conversação e escutar)
        function showNextTurn() {
            if (currentLineIndex >= dialogData.length) {
                showCompletionMessage();
                return;
            }

            const line = dialogData[currentLineIndex];
            const isUserTurn = (practiceMode === 'conversation') && (line.character === userCharacter);

            if (isUserTurn) {
                // Vez do usuário: mostra a fala e espera ele confirmar ou pular
                document.getElementById('currentLine').textContent = line.dialog;
                document.getElementById('speechFeedback').classList.add('hidden');
                document.getElementById('currentTurn').classList.remove('hidden');
            } else {
                // Vez do app: fala e avança automaticamente
                document.getElementById('currentTurn').classList.add('hidden');
                addDialogLine(line.character, line.dialog, currentLineIndex);
                speakText(line.dialog).then(() => {
                    currentLineIndex++;
                    updateProgress();
                    setTimeout(showNextTurn, 500);
                });
            }
        }

        function addDialogLine(character, text, index) {
            const history = document.getElementById('dialogHistory');
            const translation = translatedData[index]?.dialog || null;
            const isTranslated = translation && !translation.includes('[Não traduzido]') && !translation.includes('[Erro na tradução]');

            const div = document.createElement('div');
            div.className = `fade-in p-3 rounded-lg ${
                character === userCharacter
                    ? 'bg-green-100 dark:bg-green-900/30 border-l-4 border-green-500'
                    : 'bg-gray-100 dark:bg-gray-700 border-l-4 border-gray-500'
            }`;
            
            let translationHtml = '';
            if (translation && showTranslation) {
                const translationClass = isTranslated ? 'text-gray-600 dark:text-gray-400' : 'text-red-600 dark:text-red-400 italic';
                translationHtml = `<div class="mt-1 text-xs ${translationClass}">${translation}</div>`;
            }
            
            div.innerHTML = `
                <div class="font-medium">${character}:</div>
                <div class="mt-1">${text}</div>
                ${translationHtml}
            `;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function speakText(text) {
            return new Promise(resolve => {
                if (!('speechSynthesis' in window)) {
                    resolve();
                    return;
                }
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'en-GB';
                utter.rate = 0.9;

                const voices = speechSynthesis.getVoices();
                let v = voices.find(voice => voice.name === appVoice);
                if (!v) v = voices.find(voice => voice.lang === 'en-GB') || voices.find(voice => voice.lang.startsWith('en'));
                if (v) utter.voice = v;

                utter.onend = () => resolve();
                utter.onerror = () => resolve();
                speechSynthesis.speak(utter);
            });
        }

        // Reconhecimento de voz (opcional)
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return;
            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                document.getElementById('listenBtn').textContent = '🎤 Ouvindo...';
            };
            recognition.onend = () => {
                isListening = false;
                document.getElementById('listenBtn').textContent = '🎤 Começar a Falar';
            };
            recognition.onresult = e => {
                const text = e.results[0][0].transcript;
                document.getElementById('recognizedText').textContent = text;
                document.getElementById('speechFeedback').classList.remove('hidden');
            };
        }

        function startListening() {
            if (!recognition || isListening) return;
            recognition.start();
        }

        function confirmSpeech() {
            // Aceita a fala (não estamos avaliando o que o usuário falou, só avançando)
            const line = dialogData[currentLineIndex];
            addDialogLine(userCharacter, line.dialog, currentLineIndex);
            currentLineIndex++;
            updateProgress();
            document.getElementById('speechFeedback').classList.add('hidden');
            showNextTurn();
        }

        function retrySpeech() {
            document.getElementById('speechFeedback').classList.add('hidden');
            startListening();
        }

        function skipTurn() {
            // Pular a fala do usuário: ainda registra a fala original e avança
            const line = dialogData[currentLineIndex];
            addDialogLine(userCharacter, line.dialog, currentLineIndex);
            currentLineIndex++;
            updateProgress();
            document.getElementById('speechFeedback').classList.add('hidden');
            showNextTurn();
        }

        function speakUserLine() {
            const line = dialogData[currentLineIndex];
            speakText(line.dialog);
        }

        // Listen mode
        function playFullDialog() {
            let i = currentLineIndex;
            const playNext = () => {
                if (i >= dialogData.length) {
                    showCompletionMessage();
                    return;
                }
                const line = dialogData[i];
                addDialogLine(line.character, line.dialog, i);
                speakText(line.dialog).then(() => {
                    currentLineIndex = i + 1;
                    updateProgress();
                    i++;
                    setTimeout(playNext, 500);
                });
            };
            playNext();
        }

        function playCurrentLine() {
            if (currentLineIndex < dialogData.length) {
                speakText(dialogData[currentLineIndex].dialog);
            }
        }

        function updateProgress() {
            const total = dialogData.length || 1;
            const pct = (currentLineIndex / total) * 100;
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressText').textContent =
                `${currentLineIndex} de ${dialogData.length} falas`;
        }

        function showCompletionMessage() {
            const history = document.getElementById('dialogHistory');
            const div = document.createElement('div');
            div.className = 'fade-in bg-green-100 dark:bg-green-900/30 border-l-4 border-green-500 p-4 text-center';
            div.innerHTML = `
                <div class="font-medium text-green-800 dark:text-green-300">🎉 Parabéns! Você completou o diálogo!</div>
                <button onclick="resetApp()" class="mt-3 bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg">
                    🔄 Praticar Novamente
                </button>
            `;
            history.appendChild(div);
            document.getElementById('currentTurn').classList.add('hidden');
            document.getElementById('listenControls').classList.add('hidden');
        }

        function resetApp() {
            dialogData = [];
            translatedData = [];
            characters = [];
            currentLineIndex = 0;
            userCharacter = '';
            document.getElementById('dialogInput').value = '';
            document.getElementById('translationStatus').classList.add('hidden');
            showStep(1);
        }

        function showStep(n) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step' + n).classList.remove('hidden');
        }

        // inicial
        showStep(1);
        speechSynthesis.getVoices();
    </script>
</body>
</html>
